name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, same pin as agent-orchestration
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0, same pin as agent-orchestration
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check, lint, unit coverage, and accessibility
        run: npm run validate
      - name: Build
        run: npm run build
      - name: Configure Chromium
        run: |
          node --input-type=module <<'JS'
          import chromium from '@sparticuz/chromium';
          import { appendFileSync } from 'node:fs';
          appendFileSync(process.env.GITHUB_ENV, `PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${await chromium.executablePath()}\n`);
          JS
      - name: Production browser tests
        run: npm run test:e2e
      - name: Check build contents
        run: npm run check:build
      - name: Check optional build matrix
        run: npm run test:build-matrix
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-evidence
          path: |
            artifacts/
            coverage/
          if-no-files-found: warn
          retention-days: 7
